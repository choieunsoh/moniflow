schema = 1
name = "Moniflow"

[runtime]
kind = "node"
version = "24"
package_manager = "npm"

[[setup.steps]]
kind = "dependencies"
locked = true

[[setup.steps]]
run = ["npm", "run", "build:web"]

[launch]
command = ["npm", "run", "dev:web", "--", "--hostname", "{host}", "--port", "{port}"]
host = "127.0.0.1"
port = 4173

[health]
type = "http"
path = "/"
timeout_seconds = 90

# Browser storage is outside the managed checkout.
[persistence]
paths = []
